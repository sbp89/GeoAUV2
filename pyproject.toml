[project]
name = "geoauv2"
version = "2.2.0"
description = "GeoAuV2 — Plataforma Inteligente de Prospección Aurífera Multisensor, IA Espectral y Geofísica 3D"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.9.0",
    "numpy>=1.26.4",
    "scipy>=1.13.0",
    "shapely>=2.0.4",
    "pyproj>=3.6.1",
    "Pillow>=10.4.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

